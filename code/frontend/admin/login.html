<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自习座位预约系统 · 管理后台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans SC', sans-serif; }
        .bg-admin { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); }
        .glass { background: rgba(255,255,255,0.97); }
        .input-field { border: 1.5px solid #e2e8f0; transition: all 0.2s; }
        .input-field:focus { border-color: #0f3460; box-shadow: 0 0 0 3px rgba(15,52,96,0.12); outline: none; }
        .btn-admin { background: linear-gradient(135deg, #0f3460, #533483); transition: all 0.2s; }
        .btn-admin:hover { transform: translateY(-1px); box-shadow: 0 8px 25px rgba(15,52,96,0.4); }
        .tab-active { color: #0f3460; border-bottom: 2px solid #0f3460; }
    </style>
</head>
<body class="bg-admin min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-white bg-opacity-10 rounded-2xl mb-4">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-white">管理后台</h1>
            <p class="text-blue-300 text-sm mt-1">自习座位预约系统</p>
        </div>

        <div class="glass rounded-3xl shadow-2xl p-8">
            <div class="flex border-b border-gray-200 mb-6">
                <button id="tab-login" onclick="switchTab('login')" class="flex-1 pb-3 text-sm font-medium tab-active transition-all">登录</button>
                <button id="tab-register" onclick="switchTab('register')" class="flex-1 pb-3 text-sm font-medium text-gray-400 transition-all">注册</button>
            </div>

            <div id="error-msg" class="hidden mb-4 p-3 bg-red-50 border border-red-200 rounded-xl text-red-600 text-sm"></div>
            <div id="success-msg" class="hidden mb-4 p-3 bg-green-50 border border-green-200 rounded-xl text-green-600 text-sm"></div>

            <!-- 登录表单 -->
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">用户名</label>
                        <input id="login-username" type="text" placeholder="请输入用户名"
                            class="input-field w-full px-4 py-3 rounded-xl text-gray-800 text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">密码</label>
                        <input id="login-password" type="password" placeholder="请输入密码"
                            class="input-field w-full px-4 py-3 rounded-xl text-gray-800 text-sm">
                    </div>
                    <button type="submit" class="btn-admin w-full py-3 rounded-xl text-white font-medium text-sm mt-2">登录</button>
                </div>
            </form>

            <!-- 注册表单 -->
            <form id="register-form" class="hidden" onsubmit="handleRegister(event)">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">用户名</label>
                        <input id="reg-username" type="text" placeholder="请输入用户名"
                            class="input-field w-full px-4 py-3 rounded-xl text-gray-800 text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">姓名</label>
                        <input id="reg-name" type="text" placeholder="请输入姓名"
                            class="input-field w-full px-4 py-3 rounded-xl text-gray-800 text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">角色</label>
                        <select id="reg-role" class="input-field w-full px-4 py-3 rounded-xl text-gray-800 text-sm bg-white">
                            <option value="normal_admin">普通管理员</option>
                            <option value="room_admin">教室管理员</option>
                            <option value="super_admin">超级管理员</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">密码</label>
                        <input id="reg-password" type="password" placeholder="请设置密码"
                            class="input-field w-full px-4 py-3 rounded-xl text-gray-800 text-sm">
                    </div>
                    <button type="submit" class="btn-admin w-full py-3 rounded-xl text-white font-medium text-sm mt-2">注册</button>
                </div>
            </form>
        </div>
        <p class="text-center text-blue-400 text-xs mt-6">默认账号 admin / admin123</p>
    </div>

    <script src="js/api.js"></script>
    <script>
        if (getAdminId()) window.location.href = 'index.html';

        function switchTab(tab) {
            const isLogin = tab === 'login';
            document.getElementById('login-form').classList.toggle('hidden', !isLogin);
            document.getElementById('register-form').classList.toggle('hidden', isLogin);
            document.getElementById('tab-login').className = `flex-1 pb-3 text-sm font-medium transition-all ${isLogin ? 'tab-active' : 'text-gray-400'}`;
            document.getElementById('tab-register').className = `flex-1 pb-3 text-sm font-medium transition-all ${!isLogin ? 'tab-active' : 'text-gray-400'}`;
            document.getElementById('error-msg').classList.add('hidden');
            document.getElementById('success-msg').classList.add('hidden');
        }

        function showError(msg) {
            const el = document.getElementById('error-msg');
            el.textContent = msg; el.classList.remove('hidden');
            document.getElementById('success-msg').classList.add('hidden');
        }
        function showSuccess(msg) {
            const el = document.getElementById('success-msg');
            el.textContent = msg; el.classList.remove('hidden');
            document.getElementById('error-msg').classList.add('hidden');
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;
            if (!username || !password) return showError('请填写用户名和密码');
            try {
                const data = await api.adminLogin({ username, password });
                setAdminInfo(data.admin_id, data.admin_role, data.admin_name);
                showSuccess('登录成功，正在跳转...');
                setTimeout(() => window.location.href = 'index.html', 600);
            } catch (err) { showError(err.message); }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('reg-username').value.trim();
            const name = document.getElementById('reg-name').value.trim();
            const password = document.getElementById('reg-password').value;
            const role = document.getElementById('reg-role').value;
            if (!username || !name || !password) return showError('请填写完整信息');
            try {
                await api.adminRegister({ username, name, password, role });
                showSuccess('注册成功！请登录');
                setTimeout(() => switchTab('login'), 800);
            } catch (err) { showError(err.message); }
        }
    </script>
</body>
</html>
