<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 · 预约管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans SC', sans-serif; background: #f1f5f9; }
        .sidebar { background: linear-gradient(180deg, #1a1a2e, #0f3460); min-height: 100vh; width: 220px; }
        .nav-item { transition: all 0.15s; border-radius: 8px; }
        .nav-item:hover { background: rgba(255,255,255,0.1); }
        .nav-item.active { background: rgba(255,255,255,0.15); }
        .card { background: white; border-radius: 1rem; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
        .input-field { border: 1.5px solid #e2e8f0; transition: all 0.2s; }
        .input-field:focus { border-color: #0f3460; outline: none; }
        .tab-btn { padding: 6px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s; color: #6b7280; }
        .tab-btn.active { background: #0f3460; color: white; }
        .tab-btn:not(.active):hover { background: #e0e7ef; color: #0f3460; }
    </style>
</head>
<body class="flex">
    <div class="sidebar fixed top-0 left-0 flex flex-col p-4">
        <div class="text-white mb-8 mt-2">
            <div class="font-bold text-lg">管理后台</div>
            <div id="admin-info" class="text-blue-300 text-xs mt-1"></div>
        </div>
        <nav class="space-y-1 flex-1">
            <a href="index.html" class="nav-item flex items-center gap-3 px-3 py-2.5 text-blue-200 text-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2H5a2 2 0 00-2-2z"/></svg>首页概览</a>
            <a href="rooms.html" class="nav-item flex items-center gap-3 px-3 py-2.5 text-blue-200 text-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>自习室管理</a>
            <a href="reservations.html" class="nav-item active flex items-center gap-3 px-3 py-2.5 text-white text-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>预约管理</a>
            <a href="violations.html" class="nav-item flex items-center gap-3 px-3 py-2.5 text-blue-200 text-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>违约记录</a>
        </nav>
        <button onclick="handleLogout()" class="mt-4 text-red-300 text-sm px-3 py-2 nav-item text-left flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>退出登录
        </button>
    </div>

    <div class="ml-[220px] flex-1 p-6">
        <h2 class="text-xl font-bold text-gray-800 mb-4">预约管理</h2>

        <div class="card p-4 mb-4">
            <div class="font-medium text-gray-700 mb-3">代学生新增预约</div>
            <div class="grid grid-cols-2 lg:grid-cols-5 gap-2">
                <input id="f-student-id" class="input-field px-3 py-2 rounded-lg text-sm" placeholder="学生ID">
                <input id="f-seat-id" class="input-field px-3 py-2 rounded-lg text-sm" placeholder="座位ID">
                <input id="f-date" type="date" class="input-field px-3 py-2 rounded-lg text-sm">
                <input id="f-start" type="time" class="input-field px-3 py-2 rounded-lg text-sm">
                <input id="f-end" type="time" class="input-field px-3 py-2 rounded-lg text-sm">
            </div>
            <div class="mt-3 flex items-center gap-3">
                <button onclick="createReservationForStudent()" class="px-4 py-2 rounded-lg text-sm text-white bg-[#0f3460] hover:opacity-90">创建预约</button>
                <span id="create-msg" class="text-sm text-gray-400"></span>
            </div>
        </div>

        <div class="flex items-center gap-2 mb-5">
            <button class="tab-btn active" onclick="switchStatus('', this)">全部</button>
            <button class="tab-btn" onclick="switchStatus('pending', this)">待签到</button>
            <button class="tab-btn" onclick="switchStatus('checked_in', this)">已签到</button>
            <button class="tab-btn" onclick="switchStatus('cancelled', this)">已取消</button>
            <button class="tab-btn" onclick="switchStatus('violated', this)">违约</button>
        </div>

        <div class="card overflow-hidden">
            <div id="loading" class="p-10 text-center text-gray-400">加载中...</div>
            <div id="empty" class="hidden p-10 text-center text-gray-400">暂无预约记录</div>
            <div id="table-wrap" class="hidden overflow-x-auto">
                <table class="w-full text-sm">
                    <thead class="bg-gray-50">
                        <tr class="text-gray-500 text-left">
                            <th class="px-4 py-3 font-medium">ID</th>
                            <th class="px-4 py-3 font-medium">学生ID</th>
                            <th class="px-4 py-3 font-medium">自习室</th>
                            <th class="px-4 py-3 font-medium">座位</th>
                            <th class="px-4 py-3 font-medium">日期</th>
                            <th class="px-4 py-3 font-medium">时间</th>
                            <th class="px-4 py-3 font-medium">状态</th>
                            <th class="px-4 py-3 font-medium">操作</th>
                        </tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        if (!hasAdminAuth()) window.location.href = 'login.html';
        document.getElementById('admin-info').textContent = `${getAdminName() || ''} · ${roleLabel(getAdminRole())}`;

        function roleLabel(r) {
            return { super_admin: '超级管理员', room_admin: '教室管理员', normal_admin: '普通管理员' }[r] || r;
        }

        const statusLabel = { pending: '待签到', checked_in: '已签到', cancelled: '已取消', violated: '违约' };
        const statusColor = {
            pending: 'bg-yellow-50 text-yellow-700',
            checked_in: 'bg-green-50 text-green-700',
            cancelled: 'bg-gray-100 text-gray-500',
            violated: 'bg-red-50 text-red-600'
        };

        let currentStatus = '';

        async function loadReservations(status) {
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('empty').classList.add('hidden');
            document.getElementById('table-wrap').classList.add('hidden');

            try {
                const params = status ? { status } : {};
                const list = await api.getAllReservations(params);
                document.getElementById('loading').classList.add('hidden');

                if (!list.length) { document.getElementById('empty').classList.remove('hidden'); return; }

                document.getElementById('table-wrap').classList.remove('hidden');
                document.getElementById('table-body').innerHTML = list.map(r => `
                    <tr class="border-t border-gray-50 hover:bg-gray-50">
                        <td class="px-4 py-3 text-gray-400 text-xs">#${r.id}</td>
                        <td class="px-4 py-3 text-gray-600">${r.student_id}</td>
                        <td class="px-4 py-3">${r.room_name || '-'}</td>
                        <td class="px-4 py-3 font-medium">${r.seat_no || r.seat_id}</td>
                        <td class="px-4 py-3">${r.date || ''}</td>
                        <td class="px-4 py-3">${r.start_time?.slice(11,16) || ''} - ${r.end_time?.slice(11,16) || ''}</td>
                        <td class="px-4 py-3">
                            <span class="px-2 py-0.5 rounded-full text-xs font-medium ${statusColor[r.status] || ''}">
                                ${statusLabel[r.status] || r.status}
                            </span>
                        </td>
                        <td class="px-4 py-3">
                            ${r.status === 'pending' ? `
                            <button onclick="cancelReservation(${r.id})"
                                class="text-xs text-red-500 hover:text-red-700 font-medium transition">取消</button>
                            ` : '-'}
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                document.getElementById('loading').textContent = '加载失败：' + err.message;
            }
        }

        function switchStatus(status, btn) {
            currentStatus = status;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            loadReservations(status);
        }

        async function cancelReservation(id) {
            if (!confirm('确定要取消这条预约吗？')) return;
            try {
                await api.adminCancelReservation(id);
                loadReservations(currentStatus);
            } catch (err) { alert(err.message); }
        }

        async function createReservationForStudent() {
            const studentId = Number(document.getElementById('f-student-id').value);
            const seatId = Number(document.getElementById('f-seat-id').value);
            const date = document.getElementById('f-date').value;
            const start = document.getElementById('f-start').value;
            const end = document.getElementById('f-end').value;
            if (!studentId || !seatId || !date || !start || !end) {
                document.getElementById('create-msg').textContent = '请完整填写字段';
                return;
            }
            try {
                await api.adminCreateReservation({
                    student_id: studentId,
                    seat_id: seatId,
                    date,
                    start_time: `${start}:00`,
                    end_time: `${end}:00`,
                });
                document.getElementById('create-msg').textContent = '创建成功';
                loadReservations(currentStatus);
            } catch (err) {
                document.getElementById('create-msg').textContent = `创建失败：${err.message}`;
            }
        }

        function handleLogout() { clearAdmin(); window.location.href = '../index.html'; }

        loadReservations('');
    </script>
</body>
</html>
