<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 · 数据统计</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans SC', sans-serif; background: #f1f5f9; }
        .sidebar { background: linear-gradient(180deg, #1a1a2e, #0f3460); min-height: 100vh; width: 220px; }
        .nav-item { transition: all 0.15s; border-radius: 8px; }
        .nav-item:hover { background: rgba(255,255,255,0.1); }
        .nav-item.active { background: rgba(255,255,255,0.15); }
        .card { background: white; border-radius: 1rem; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
    </style>
</head>
<body class="flex">
    <div class="sidebar fixed top-0 left-0 flex flex-col p-4">
        <div class="text-white mb-8 mt-2"><div class="font-bold text-lg">管理后台</div><div id="admin-info" class="text-blue-300 text-xs mt-1"></div></div>
        <nav class="space-y-1 flex-1">
            <a href="index.html" class="nav-item px-3 py-2.5 text-blue-200 text-sm block">首页概览</a>
            <a href="stats.html" class="nav-item active px-3 py-2.5 text-white text-sm block">数据统计</a>
        </nav>
    </div>
    <div class="ml-[220px] flex-1 p-6">
        <h2 class="text-xl font-bold text-gray-800 mb-4">数据统计</h2>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <div class="card p-4">
                <div class="font-medium text-gray-700 mb-2">座位占用率</div>
                <div id="occupancy" class="text-sm text-gray-400">加载中...</div>
            </div>
            <div class="card p-4">
                <div class="font-medium text-gray-700 mb-2">近期预约趋势（7天）</div>
                <div id="trend" class="text-sm text-gray-400">加载中...</div>
            </div>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script>
        if (!hasAdminAuth()) window.location.href = 'login.html';
        document.getElementById('admin-info').textContent = `${getAdminName() || ''} · ${getAdminRole() || ''}`;
        async function loadStats() {
            const [occupancy, trend] = await Promise.all([api.getOccupancyStats(), api.getReservationTrend(7)]);
            document.getElementById('occupancy').innerHTML = occupancy.length
                ? occupancy.map(o => `<div class="py-1 border-b border-gray-100">${o.room_name}：${o.occupancy_rate}% (${o.occupied_seats}/${o.total_seats})</div>`).join('')
                : '暂无数据';
            document.getElementById('trend').innerHTML = trend.length
                ? trend.map(t => `<div class="py-1 border-b border-gray-100">${t.date}：${t.reservation_count}</div>`).join('')
                : '暂无数据';
        }
        loadStats();
    </script>
</body>
</html>
