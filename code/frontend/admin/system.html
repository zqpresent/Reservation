<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 · 系统参数</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans SC', sans-serif; background: #f1f5f9; }
        .sidebar { background: linear-gradient(180deg, #1a1a2e, #0f3460); min-height: 100vh; width: 220px; }
        .nav-item { transition: all 0.15s; border-radius: 8px; }
        .nav-item:hover { background: rgba(255,255,255,0.1); }
        .nav-item.active { background: rgba(255,255,255,0.15); }
        .card { background: white; border-radius: 1rem; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
    </style>
</head>
<body class="flex">
    <div class="sidebar fixed top-0 left-0 flex flex-col p-4">
        <div class="text-white mb-8 mt-2"><div class="font-bold text-lg">管理后台</div><div id="admin-info" class="text-blue-300 text-xs mt-1"></div></div>
        <nav class="space-y-1 flex-1">
            <a href="index.html" class="nav-item px-3 py-2.5 text-blue-200 text-sm block">首页概览</a>
            <a href="system.html" class="nav-item active px-3 py-2.5 text-white text-sm block">系统参数</a>
            <a href="stats.html" class="nav-item px-3 py-2.5 text-blue-200 text-sm block">数据统计</a>
        </nav>
    </div>
    <div class="ml-[220px] flex-1 p-6">
        <h2 class="text-xl font-bold text-gray-800 mb-4">系统参数配置</h2>
        <div class="card p-4">
            <table class="w-full text-sm">
                <thead><tr class="text-left text-gray-500 border-b"><th class="py-2">参数</th><th>值</th><th>说明</th><th>操作</th></tr></thead>
                <tbody id="tbody"><tr><td colspan="4" class="py-2 text-gray-400">加载中...</td></tr></tbody>
            </table>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script>
        if (!hasAdminAuth()) window.location.href = 'login.html';
        document.getElementById('admin-info').textContent = `${getAdminName() || ''} · ${getAdminRole() || ''}`;
        async function loadParams() {
            const rows = await api.getSystemParams();
            document.getElementById('tbody').innerHTML = rows.map(r => `
                <tr class="border-b border-gray-50">
                    <td class="py-2">${r.key}</td>
                    <td><input id="v-${r.id}" value="${r.value}" class="border rounded px-2 py-1 w-28"></td>
                    <td class="text-gray-500">${r.description || ''}</td>
                    <td><button class="text-blue-600" onclick="saveParam('${r.key}', ${r.id})">保存</button></td>
                </tr>
            `).join('');
        }
        async function saveParam(key, id) {
            const value = document.getElementById(`v-${id}`).value;
            await api.updateSystemParam(key, value);
            loadParams();
        }
        loadParams();
    </script>
</body>
</html>
