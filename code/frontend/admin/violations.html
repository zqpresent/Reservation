<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 · 违约记录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans SC', sans-serif; background: #f1f5f9; }
        .sidebar { background: linear-gradient(180deg, #1a1a2e, #0f3460); min-height: 100vh; width: 220px; }
        .nav-item { transition: all 0.15s; border-radius: 8px; }
        .nav-item:hover { background: rgba(255,255,255,0.1); }
        .nav-item.active { background: rgba(255,255,255,0.15); }
        .card { background: white; border-radius: 1rem; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
    </style>
</head>
<body class="flex">
    <div class="sidebar fixed top-0 left-0 flex flex-col p-4">
        <div class="text-white mb-8 mt-2">
            <div class="font-bold text-lg">管理后台</div>
            <div id="admin-info" class="text-blue-300 text-xs mt-1"></div>
        </div>
        <nav class="space-y-1 flex-1">
            <a href="index.html" class="nav-item flex items-center gap-3 px-3 py-2.5 text-blue-200 text-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2H5a2 2 0 00-2-2z"/></svg>首页概览</a>
            <a href="rooms.html" class="nav-item flex items-center gap-3 px-3 py-2.5 text-blue-200 text-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>自习室管理</a>
            <a href="reservations.html" class="nav-item flex items-center gap-3 px-3 py-2.5 text-blue-200 text-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>预约管理</a>
            <a href="violations.html" class="nav-item active flex items-center gap-3 px-3 py-2.5 text-white text-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>违约记录</a>
        </nav>
        <button onclick="handleLogout()" class="mt-4 text-red-300 text-sm px-3 py-2 nav-item text-left flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>退出登录
        </button>
    </div>

    <div class="ml-[220px] flex-1 p-6">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-xl font-bold text-gray-800">违约记录</h2>
            <span id="total-count" class="text-sm text-gray-400"></span>
        </div>

        <div class="card overflow-hidden">
            <div id="loading" class="p-10 text-center text-gray-400">加载中...</div>
            <div id="empty" class="hidden p-10 text-center text-gray-400">
                <svg class="w-12 h-12 mx-auto mb-3 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                暂无违约记录
            </div>
            <div id="table-wrap" class="hidden overflow-x-auto">
                <table class="w-full text-sm">
                    <thead class="bg-gray-50">
                        <tr class="text-gray-500 text-left">
                            <th class="px-4 py-3 font-medium">ID</th>
                            <th class="px-4 py-3 font-medium">学生姓名</th>
                            <th class="px-4 py-3 font-medium">学号</th>
                            <th class="px-4 py-3 font-medium">对应预约ID</th>
                            <th class="px-4 py-3 font-medium">违约时间</th>
                        </tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        if (!getAdminId()) window.location.href = 'login.html';
        document.getElementById('admin-info').textContent = `${getAdminName() || ''} · ${roleLabel(getAdminRole())}`;

        function roleLabel(r) {
            return { super_admin: '超级管理员', room_admin: '教室管理员', normal_admin: '普通管理员' }[r] || r;
        }

        async function loadViolations() {
            try {
                const list = await api.getViolations();
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('total-count').textContent = `共 ${list.length} 条`;

                if (!list.length) { document.getElementById('empty').classList.remove('hidden'); return; }

                document.getElementById('table-wrap').classList.remove('hidden');
                document.getElementById('table-body').innerHTML = list.map(v => `
                    <tr class="border-t border-gray-50 hover:bg-gray-50">
                        <td class="px-4 py-3 text-gray-400 text-xs">#${v.id}</td>
                        <td class="px-4 py-3 font-medium text-gray-800">${v.student_name || '-'}</td>
                        <td class="px-4 py-3 text-gray-500">${v.student_no || '-'}</td>
                        <td class="px-4 py-3 text-gray-500">#${v.reservation_id}</td>
                        <td class="px-4 py-3 text-gray-500">${v.violated_at ? String(v.violated_at).slice(0,19).replace('T',' ') : '-'}</td>
                    </tr>
                `).join('');
            } catch (err) {
                document.getElementById('loading').textContent = '加载失败：' + err.message;
            }
        }

        function handleLogout() { clearAdmin(); window.location.href = 'login.html'; }

        loadViolations();
    </script>
</body>
</html>
