<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自习座位预约系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans SC', sans-serif; }
        .bg-main {
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            min-height: 100vh;
        }
        .card-student {
            background: linear-gradient(135deg, #1a8a6e, #2d6a9f);
            transition: all 0.25s;
        }
        .card-admin {
            background: linear-gradient(135deg, #0f3460, #533483);
            transition: all 0.25s;
        }
        .entry-card {
            border-radius: 1.5rem;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .entry-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .entry-card:hover::before { opacity: 1; }
        .entry-card:hover { transform: translateY(-6px); box-shadow: 0 20px 50px rgba(0,0,0,0.4); }
        .entry-card:active { transform: translateY(-2px); }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.4); animation: pulse 2s infinite; }
        .dot:nth-child(2) { animation-delay: 0.3s; }
        .dot:nth-child(3) { animation-delay: 0.6s; }
        @keyframes pulse { 0%, 100% { opacity: 0.4; transform: scale(1); } 50% { opacity: 1; transform: scale(1.3); } }
    </style>
</head>
<body class="bg-main flex flex-col items-center justify-center min-h-screen p-6">

    <!-- 标题 -->
    <div class="text-center mb-12">
        <div class="flex items-center justify-center gap-2 mb-2">
            <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
        <h1 class="text-4xl font-black text-white tracking-tight mt-4">自习座位预约系统</h1>
        <p class="text-blue-300 mt-2 text-sm font-light">随时随地，轻松预约你的专属自习位</p>
    </div>

    <!-- 入口卡片 -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-2xl">

        <!-- 学生端 -->
        <a href="javascript:void(0)" onclick="goStudent()" class="entry-card card-student p-8 text-white no-underline block">
            <div class="mb-6">
                <div class="w-14 h-14 bg-white/20 rounded-2xl flex items-center justify-center mb-4">
                    <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 14l9-5-9-5-9 5 9 5z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"/>
                    </svg>
                </div>
                <h2 class="text-xl font-bold">学生端</h2>
                <p class="text-green-100 text-sm mt-1.5 font-light leading-relaxed">
                    预约座位、签到打卡<br>查看历史记录
                </p>
            </div>
            <div class="flex items-center gap-2 text-sm text-white/70">
                <span>进入学生端</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                </svg>
            </div>
        </a>

        <!-- 管理端 -->
        <a href="javascript:void(0)" onclick="goAdmin()" class="entry-card card-admin p-8 text-white no-underline block">
            <div class="mb-6">
                <div class="w-14 h-14 bg-white/20 rounded-2xl flex items-center justify-center mb-4">
                    <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                    </svg>
                </div>
                <h2 class="text-xl font-bold">管理后台</h2>
                <p class="text-blue-200 text-sm mt-1.5 font-light leading-relaxed">
                    管理自习室与座位<br>查看预约与违约记录
                </p>
            </div>
            <div class="flex items-center gap-2 text-sm text-white/70">
                <span>进入管理后台</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                </svg>
            </div>
        </a>
    </div>

    <p class="text-blue-400/50 text-xs mt-12">© 2026 自习座位预约系统 · Demo</p>

    <script>
        function goStudent() {
            localStorage.removeItem('token');
            localStorage.removeItem('student_id');
            window.location.href = 'student/login.html';
        }
        function goAdmin() {
            localStorage.removeItem('admin_id');
            localStorage.removeItem('admin_role');
            localStorage.removeItem('admin_name');
            window.location.href = 'admin/login.html';
        }
    </script>
</body>
</html>
