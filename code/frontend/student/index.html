<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自习座位预约系统 · 首页</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans SC', sans-serif; background: #f0f4f8; }
        .nav-gradient { background: linear-gradient(135deg, #1e3a5f, #2d6a9f); }
        .card { background: white; border-radius: 1rem; box-shadow: 0 2px 12px rgba(0,0,0,0.07); }
        .room-card {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 2px 12px rgba(0,0,0,0.07);
            transition: all 0.2s;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .room-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(45, 106, 159, 0.15);
            border-color: #2d6a9f;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 500;
        }
        .badge-open { background: #dcfce7; color: #16a34a; }
        .badge-closed { background: #fee2e2; color: #dc2626; }
        .nav-link { transition: background 0.15s; }
        .nav-link:hover { background: rgba(255,255,255,0.15); border-radius: 8px; }
        .nav-link.active { background: rgba(255,255,255,0.2); border-radius: 8px; }
        .skeleton { background: linear-gradient(90deg, #f0f4f8 25%, #e2e8f0 50%, #f0f4f8 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 8px; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="nav-gradient text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                </svg>
                <span class="font-bold text-lg">自习座位预约</span>
            </div>
            <div class="flex items-center gap-1">
                <a href="index.html" class="nav-link active px-3 py-1.5 text-sm">首页</a>
                <a href="search.html" class="nav-link px-3 py-1.5 text-sm">搜索座位</a>
                <a href="reservations.html" class="nav-link px-3 py-1.5 text-sm">我的预约</a>
                <a href="history.html" class="nav-link px-3 py-1.5 text-sm">历史记录</a>
                <div class="ml-3 pl-3 border-l border-white/30 flex items-center gap-2">
                    <span id="nav-username" class="text-sm text-blue-200"></span>
                    <button onclick="handleLogout()" class="text-sm text-red-300 hover:text-red-100 transition">退出</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto px-4 py-6">
        <!-- 欢迎横幅 -->
        <div class="bg-gradient-to-r from-blue-600 to-teal-500 rounded-2xl p-6 text-white mb-6 flex items-center justify-between">
            <div>
                <h2 class="text-xl font-bold mb-1">你好，<span id="welcome-name">同学</span> 👋</h2>
                <p class="text-blue-100 text-sm">快来预约一个安静的自习座位吧</p>
            </div>
            <a href="search.html"
                class="bg-white text-blue-600 font-medium px-5 py-2.5 rounded-xl text-sm hover:bg-blue-50 transition flex items-center gap-1.5">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
                立即搜座
            </a>
        </div>

        <!-- 今日预约提醒 -->
        <div id="today-card" class="hidden card p-5 mb-6">
            <h3 class="font-semibold text-gray-800 mb-3 flex items-center gap-2">
                <svg class="w-5 h-5 text-yellow-500" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd"/>
                </svg>
                今日预约
            </h3>
            <div id="today-list" class="space-y-2"></div>
        </div>

        <!-- 自习室列表 -->
        <div class="flex items-center justify-between mb-4">
            <h3 class="font-semibold text-gray-800 text-lg">可用自习室</h3>
            <span id="room-count" class="text-sm text-gray-400"></span>
        </div>

        <!-- 骨架屏 -->
        <div id="skeleton" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <div class="card p-5 space-y-3">
                <div class="skeleton h-5 w-3/4"></div>
                <div class="skeleton h-4 w-1/2"></div>
                <div class="skeleton h-4 w-2/3"></div>
            </div>
            <div class="card p-5 space-y-3">
                <div class="skeleton h-5 w-3/4"></div>
                <div class="skeleton h-4 w-1/2"></div>
                <div class="skeleton h-4 w-2/3"></div>
            </div>
            <div class="card p-5 space-y-3">
                <div class="skeleton h-5 w-3/4"></div>
                <div class="skeleton h-4 w-1/2"></div>
                <div class="skeleton h-4 w-2/3"></div>
            </div>
        </div>

        <div id="room-grid" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        <div id="empty-rooms" class="hidden card p-10 text-center text-gray-400">
            <svg class="w-12 h-12 mx-auto mb-3 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                    d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
            </svg>
            暂无可用自习室
        </div>
    </div>

    <!-- 座位选择弹窗 -->
    <div id="seat-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[80vh] flex flex-col">
            <div class="p-5 border-b border-gray-100 flex items-center justify-between">
                <h3 id="modal-title" class="font-bold text-gray-800 text-lg"></h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <div id="modal-content" class="p-5 overflow-y-auto flex-1">
                <div class="text-center text-gray-400 py-8">加载中...</div>
            </div>
            <div class="p-4 border-t border-gray-100">
                <a id="modal-search-btn" href="#" class="block w-full text-center bg-gradient-to-r from-blue-600 to-teal-500 text-white py-2.5 rounded-xl font-medium text-sm hover:opacity-90 transition">
                    去搜索可用时段
                </a>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        if (!getToken()) window.location.href = 'login.html';

        const now = new Date();
        const today = now.toISOString().slice(0, 10);

        // 加载用户信息
        async function loadUser() {
            try {
                const user = await api.getMe();
                document.getElementById('nav-username').textContent = user.name;
                document.getElementById('welcome-name').textContent = user.name;
            } catch (err) {
                // 任何错误都不强制跳转，只在明确401且无网络问题时才登出
                if (err.status === 401) {
                    // 再等500ms确认不是时序问题
                    setTimeout(() => {
                        if (!getToken()) window.location.href = 'login.html';
                    }, 500);
                }
            }
        }

        // 加载今日预约
        async function loadTodayReservations() {
            try {
                const list = await api.getMyReservations('pending');
                const today = new Date().toISOString().slice(0, 10);
                const todayItems = list.filter(r => r.date === today);
                if (todayItems.length > 0) {
                    document.getElementById('today-card').classList.remove('hidden');
                    document.getElementById('today-list').innerHTML = todayItems.map(r => `
                        <div class="flex items-center justify-between bg-blue-50 rounded-xl p-3">
                            <div>
                                <span class="font-medium text-blue-900 text-sm">${r.room_name || ''} · 座位 ${r.seat_no || r.seat_id}</span>
                                <span class="ml-2 text-blue-600 text-xs">${r.start_time?.slice(0,5)} - ${r.end_time?.slice(0,5)}</span>
                            </div>
                            <span class="status-badge badge-open">待签到</span>
                        </div>
                    `).join('');
                }
            } catch {}
        }

        // 判断当前是否在开放时间内
        function isOpen(openTime, closeTime) {
            const [oh, om] = openTime.split(':').map(Number);
            const [ch, cm] = closeTime.split(':').map(Number);
            const cur = now.getHours() * 60 + now.getMinutes();
            return cur >= oh * 60 + om && cur < ch * 60 + cm;
        }

        // 加载自习室
        async function loadRooms() {
            try {
                const rooms = await api.getRooms();
                document.getElementById('skeleton').classList.add('hidden');

                if (!rooms || rooms.length === 0) {
                    document.getElementById('empty-rooms').classList.remove('hidden');
                    return;
                }

                document.getElementById('room-count').textContent = `共 ${rooms.length} 个自习室`;
                const grid = document.getElementById('room-grid');
                grid.classList.remove('hidden');
                grid.innerHTML = rooms.map(room => {
                    const open = isOpen(room.open_time, room.close_time);
                    return `
                        <div class="room-card p-5" onclick="openRoomModal(${room.id}, '${room.name}', '${room.open_time}', '${room.close_time}')">
                            <div class="flex items-start justify-between mb-3">
                                <div>
                                    <h4 class="font-semibold text-gray-800">${room.name}</h4>
                                    <p class="text-gray-400 text-sm mt-0.5">${room.building || ''}</p>
                                </div>
                                <span class="status-badge ${open ? 'badge-open' : 'badge-closed'}">
                                    <span class="w-1.5 h-1.5 rounded-full ${open ? 'bg-green-500' : 'bg-red-500'}"></span>
                                    ${open ? '开放中' : '已关闭'}
                                </span>
                            </div>
                            <div class="flex items-center gap-4 text-sm text-gray-500">
                                <span class="flex items-center gap-1">
                                    <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                    </svg>
                                    ${room.open_time.slice(0,5)} - ${room.close_time.slice(0,5)}
                                </span>
                                ${room.department ? `<span class="flex items-center gap-1">
                                    <svg class="w-4 h-4 text-teal-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
                                    </svg>
                                    ${room.department}
                                </span>` : ''}
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                document.getElementById('skeleton').classList.add('hidden');
                if (err.status === 401) {
                    handleLogout();
                } else {
                    document.getElementById('empty-rooms').classList.remove('hidden');
                }
            }
        }

        // 打开自习室弹窗
        async function openRoomModal(roomId, roomName, openTime, closeTime) {
            document.getElementById('modal-title').textContent = roomName;
            document.getElementById('modal-search-btn').href = `search.html?room_id=${roomId}`;
            document.getElementById('seat-modal').classList.remove('hidden');
            document.getElementById('modal-content').innerHTML = '<div class="text-center text-gray-400 py-8">加载座位中...</div>';

            try {
                const seats = await api.getRoomSeats(roomId);
                const total = seats.length;
                const available = seats.filter(s => s.is_available !== false && s.status !== 'unavailable').length;

                document.getElementById('modal-content').innerHTML = `
                    <div class="mb-4 flex gap-3">
                        <div class="flex-1 bg-blue-50 rounded-xl p-3 text-center">
                            <div class="text-2xl font-bold text-blue-600">${total}</div>
                            <div class="text-xs text-blue-400 mt-0.5">总座位</div>
                        </div>
                        <div class="flex-1 bg-green-50 rounded-xl p-3 text-center">
                            <div class="text-2xl font-bold text-green-600">${available}</div>
                            <div class="text-xs text-green-400 mt-0.5">可用</div>
                        </div>
                        <div class="flex-1 bg-gray-50 rounded-xl p-3 text-center">
                            <div class="text-2xl font-bold text-gray-500">${total - available}</div>
                            <div class="text-xs text-gray-400 mt-0.5">暂不可用</div>
                        </div>
                    </div>
                    <div class="grid grid-cols-4 sm:grid-cols-6 gap-2">
                        ${seats.map(s => {
                            const ok = s.is_available !== false && s.status !== 'unavailable';
                            const tags = [s.has_power && '🔌', s.by_window && '🪟'].filter(Boolean).join('');
                            return `
                                <div class="rounded-lg p-2 text-center text-xs ${ok ? 'bg-blue-50 text-blue-700 border border-blue-100' : 'bg-gray-100 text-gray-400'}">
                                    <div class="font-medium">${s.seat_no}</div>
                                    ${tags ? `<div class="mt-0.5 text-xs">${tags}</div>` : ''}
                                </div>
                            `;
                        }).join('')}
                    </div>
                    <p class="text-xs text-gray-400 mt-4 text-center">点击"去搜索可用时段"按时间段预约</p>
                `;
            } catch {
                document.getElementById('modal-content').innerHTML = '<div class="text-center text-red-400 py-8">加载失败，请重试</div>';
            }
        }

        function closeModal() {
            document.getElementById('seat-modal').classList.add('hidden');
        }

        document.getElementById('seat-modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        function handleLogout() {
            clearToken();
            window.location.href = '../index.html';
        }

        loadUser();
        loadRooms();
        loadTodayReservations();
    </script>
</body>
</html>
